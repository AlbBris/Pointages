name: Apply V1.14.7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v147.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python3 .github/apply_v147.py
      - name: Validate JavaScript
        run: |
          node --check js/excel-export.js
          node --check js/app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v147.yml .github/apply_v147.py
          git add index.html js/excel-export.js sw.js
          git commit -m "Corrige export iBAT Excel V1.14.7"
          git push
