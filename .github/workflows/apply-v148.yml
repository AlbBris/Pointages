name: Apply V1.14.8 ExcelJS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v148.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer migration V1.14.8
        run: |
          python3 .github/apply_v148.py
          mkdir -p vendor
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js -o vendor/exceljs.min.js
          test -s vendor/exceljs.min.js
          node --check js/excel-export.js
          node --check js/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/apply_v148.py .github/workflows/apply-v148.yml
          git add index.html js/app.js js/excel-export.js sw.js vendor/exceljs.min.js
          git commit -m "Fiabilise export iBAT avec ExcelJS V1.14.8"
          git push
